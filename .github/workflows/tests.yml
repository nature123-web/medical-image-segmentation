name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # CPU-only torch: the default wheel pulls ~2 GB of CUDA libraries that
        # a test runner will never use, and the install dominates the job time.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test training and inference
        # The unit tests cover components; this checks the CLI entry points
        # still run end to end, which is what actually breaks on refactors.
        run: |
          python - <<'PY'
          import yaml, pathlib
          cfg = yaml.safe_load(pathlib.Path("configs/base.yaml").read_text())
          cfg["data"].update(n_train=24, n_val=12, n_test=12, size=64)
          cfg["model"].update(base_channels=8, depth=2)
          pathlib.Path("configs/_ci.yaml").write_text(yaml.safe_dump(cfg))
          PY
          python -m src.train --config configs/_ci.yaml --epochs 1 --out-dir runs/ci
          python -m src.predict --checkpoint runs/ci/best.pt
